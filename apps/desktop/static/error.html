<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PriPerFin</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f8f7; --fg:#11161c; --muted:#5d6b66; --panel:#fff; --border:#dfe6e3; --danger:#b4332a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#11161c; --fg:#e9efec; --muted:#93a39d; --panel:#171e25; --border:#273138; --danger:#f08a80; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); padding: 32px 24px;
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 680px; }
  h1 { font-size: 19px; font-weight: 600; margin: 0 0 10px; color: var(--danger); letter-spacing: -0.01em; }
  p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  pre {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin: 0; overflow: auto; max-height: 50vh;
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap; word-break: break-word;
  }
</style>
</head>
<body>
  <main>
    <h1 id="message">PriPerFin could not start.</h1>
    <p>Details are below and in the log file. Use the dialog to open the logs or data folder.</p>
    <pre id="detail"></pre>
  </main>
  <script>
    // The main process passes the payload as a URI-encoded JSON fragment,
    // because this page is loaded from disk with no server to query.
    try {
      var raw = decodeURIComponent(location.hash.replace(/^#/, ''));
      if (raw) {
        var payload = JSON.parse(raw);
        if (payload.message) document.getElementById('message').textContent = payload.message;
        if (payload.detail) document.getElementById('detail').textContent = payload.detail;
      }
    } catch (e) {
      document.getElementById('detail').textContent = String(e);
    }
  </script>
</body>
</html>
