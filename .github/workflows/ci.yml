name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        # pnpm build type-checks apps/desktop, which only needs Electron's type
        # definitions from the npm package, not the ~100MB prebuilt binary.
        # The desktop packaging workflows deliberately do not set this.
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: Lint Code
        run: pnpm lint

      - name: Run Tests
        run: pnpm test

      - name: Build Packages
        run: pnpm build

  addon-image:
    name: Add-on Image Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The Home Assistant add-on image is the primary product, and almost any
    # change can break it: apps/api, apps/web, the root package.json, the
    # lockfile or the Dockerfile itself. Build it on every run rather than
    # discovering a broken image during a release, after the GitHub Release has
    # already been published.
    #
    # A plain docker build is faithful here: the Dockerfile pins node:20-alpine
    # directly and takes no ARG BUILD_FROM, so home-assistant/builder does not
    # change what gets built.
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Add-on Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          tags: priperfin:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ha-integration:
    name: Home Assistant integration (hassfest + HACS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Validates custom_components/priperfin the way Home Assistant core does
      # (manifest, strings, translations, services).
      - name: hassfest
        uses: home-assistant/actions/hassfest@master

      # Validates what HACS needs to list the repository (hacs.json, manifest).
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  ha-integration-tests:
    name: Home Assistant integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test harness
        run: pip install pytest-homeassistant-custom-component

      - name: Run tests
        run: pytest tests -q
