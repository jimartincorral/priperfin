name: Desktop CI

# Packaging failures are invisible to the Linux lint/test/build in ci.yml: the
# native modules (better-sqlite3, bcrypt) are rebuilt against Electron's ABI
# only at package time, and a mismatch produces an app that builds green and
# then crashes on launch. This catches that before a release depends on it.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/desktop/**'
      - 'apps/api/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop-ci.yml'
  workflow_dispatch:

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Installer (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            # Pinned, not windows-latest. That image is now Windows Server
            # 2025 and ships Visual Studio 18, which the node-gyp bundled with
            # pnpm 9.0.0 (v10.1.0) cannot detect -- it reports
            # 'unknown version "undefined"' and fails to configure, so
            # better-sqlite3 cannot compile during the root install.
            # windows-2022 ships Visual Studio 2022, which that node-gyp
            # handles. The durable fix is to bump pnpm so it bundles
            # node-gyp >= 11; that touches the add-on image build too, so it is
            # deliberately kept out of this change.
            runner: windows-2022
            builder_args: --win --x64
            artifact_glob: apps/desktop/release/*.exe
          - label: macos-arm64
            runner: macos-latest
            builder_args: --mac --arm64
            artifact_glob: apps/desktop/release/*.dmg

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-ci-${{ matrix.label }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-ci-${{ matrix.label }}-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API and Web
        run: |
          pnpm -F api build
          pnpm -F web build

      # A real installer, not --dir: the only way to actually test the app is to
      # install it, and the alternative (release.yml's desktop job) requires
      # publishing a GitHub Release, which also pushes an add-on update to Home
      # Assistant users. pack.mjs passes --publish never.
      #
      # This also exercises the native-module rebuild against Electron's ABI,
      # which the Linux lint/test/build in ci.yml cannot see: a mismatch there
      # produces an app that builds green and crashes on launch.
      #
      # No signing secrets are referenced, so this is safe on fork PRs.
      - name: Build Installer
        env:
          EB_ARGS: ${{ matrix.builder_args }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: bash
        run: node apps/desktop/scripts/pack.mjs $EB_ARGS

      # electron-builder skips macOS signing (no Developer ID), so
      # scripts/adhoc-sign.cjs seals the bundle with an ad-hoc signature in
      # afterPack. Prove it: a broken or missing seal makes macOS report the
      # app as "damaged", with no "Open Anyway" button. Not spctl -- that checks
      # for a Developer ID and always rejects an ad-hoc app.
      - name: Verify macOS ad-hoc signature
        if: matrix.label == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(apps/desktop/release/mac*/*.app)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "::error::No .app bundle found under apps/desktop/release/mac*/"
            ls -la apps/desktop/release || true
            exit 1
          fi
          for app in "${apps[@]}"; do
            echo "Verifying ${app}"
            codesign --verify --deep --strict --verbose=2 "${app}"
            codesign --display --verbose=2 "${app}" 2>&1 | grep -E '^(Identifier|Format|Signature|TeamIdentifier)=' || true
          done

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: priperfin-${{ matrix.label }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14
