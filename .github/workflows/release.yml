name: Release & Publish Add-on

on:
  push:
    tags:
      - 'v*'
  # Cut a release from the Actions tab when a tag cannot be pushed directly.
  # The version defaults to config.yaml — the file Home Assistant reads to
  # decide which image tag to pull — so the release, the git tag and the
  # published image tag cannot drift apart.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (defaults to config.yaml)'
        required: false
        type: string

concurrency:
  group: release-${{ inputs.version || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: resolve
        env:
          # Via env rather than direct interpolation, so the input cannot be
          # injected into the script.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          config_version="$(
            grep -E '^version:' config.yaml \
              | head -1 \
              | sed -E 's/^version:[[:space:]]*"?([^"[:space:]]+)"?.*$/\1/'
          )"

          if [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${config_version}"
          fi
          version="${version#v}"

          if [ -z "${version}" ]; then
            echo "::error::Could not determine which version to release."
            exit 1
          fi

          # Home Assistant pulls priperfin-{arch}:<config.yaml version>, and the
          # builder below tags the image from that same file. Releasing a tag
          # that disagrees with it publishes an image nobody will pull.
          if [ "${version}" != "${config_version}" ]; then
            echo "::error::config.yaml is ${config_version} but this run would release v${version}. Bump config.yaml first so the release, the tag and the image tag agree."
            exit 1
          fi

          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${version} (config.yaml: ${config_version})"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # Explicit, because on workflow_dispatch github.ref is a branch.
          # The action creates the tag at target_commitish if it is missing.
          tag_name: ${{ steps.resolve.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish (${{ matrix.arch }})
    needs: release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Publish Add-on
        uses: home-assistant/builder@2025.02.0
        with:
          image: ${{ matrix.arch }}
          args: |
            --${{ matrix.arch }} \
            --target . \
            --image "priperfin-{arch}" \
            --docker-hub "ghcr.io/${{ github.repository_owner }}" \
            --self-cache

  desktop:
    name: Desktop Installer (${{ matrix.label }})
    needs: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            # Pinned, not windows-latest. That image is now Windows Server
            # 2025 and ships Visual Studio 18, which the node-gyp bundled with
            # pnpm 9.0.0 (v10.1.0) cannot detect -- it reports
            # 'unknown version "undefined"' and fails to configure, so
            # better-sqlite3 cannot compile during the root install.
            # windows-2022 ships Visual Studio 2022, which that node-gyp
            # handles. The durable fix is to bump pnpm so it bundles
            # node-gyp >= 11; that touches the add-on image build too, so it is
            # deliberately kept out of this change.
            runner: windows-2022
            builder_args: --win --x64
          - label: macos-arm64
            runner: macos-latest
            builder_args: --mac --arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # The Electron binary is ~100MB per platform and is otherwise fetched on
      # every cold runner. Keyed on the lockfile so an Electron bump busts it.
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ matrix.label }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ matrix.label }}-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # config.yaml is the only source of truth for the version.
      # apps/desktop/package.json stays at 0.0.0 in git; scripts/pack.mjs reads
      # config.yaml and passes it via --config.extraMetadata.version, so there
      # is nothing to stamp here and the working tree stays clean.
      - name: Show resolved version
        shell: bash
        run: |
          set -euo pipefail
          resolved="$(node apps/desktop/scripts/version.mjs)"
          echo "config.yaml version: ${resolved}"
          if [ "${resolved}" != "${{ needs.release.outputs.version }}" ]; then
            echo "::error::config.yaml reports ${resolved} but the release is ${{ needs.release.outputs.version }}."
            exit 1
          fi

      - name: Build API and Web
        run: |
          pnpm -F api build
          pnpm -F web build

      # pack.mjs stages the server, rebuilds the native modules for Electron's
      # ABI, compiles the shell and runs electron-builder with --publish never.
      # That flag is load bearing: electron-builder's own GitHub publisher
      # creates a DRAFT release, which Home Assistant cannot see. Assets are
      # attached below to the release this workflow already published.
      - name: Build Installer
        shell: bash
        env:
          EB_ARGS: ${{ matrix.builder_args }}
          # Windows Authenticode / Apple Developer ID. Unset today, so no-ops.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Apple notarization, read by scripts/notarize.cjs. Unset today.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Without a certificate, stop electron-builder searching the login
          # keychain for a Developer ID and failing when it finds none. Adding
          # the CSC_LINK secret flips this on with no workflow edit.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' && 'true' || 'false' }}
        run: node apps/desktop/scripts/pack.mjs $EB_ARGS

      # electron-builder skips macOS signing (no Developer ID), so
      # scripts/adhoc-sign.cjs seals the bundle with an ad-hoc signature in
      # afterPack. Prove it: a broken or missing seal makes macOS report the
      # app as "damaged", with no "Open Anyway" button. Not spctl -- that checks
      # for a Developer ID and always rejects an ad-hoc app.
      - name: Verify macOS ad-hoc signature
        if: matrix.label == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(apps/desktop/release/mac*/*.app)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "::error::No .app bundle found under apps/desktop/release/mac*/"
            ls -la apps/desktop/release || true
            exit 1
          fi
          for app in "${apps[@]}"; do
            echo "Verifying ${app}"
            codesign --verify --deep --strict --verbose=2 "${app}"
            codesign --display --verbose=2 "${app}" 2>&1 | grep -E '^(Identifier|Format|Signature|TeamIdentifier)=' || true
          done

      - name: Locate artifact
        id: artifact
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          case "${LABEL}" in
            windows-x64) name="PriPerFin-Setup-${VERSION}.exe" ;;
            macos-arm64) name="PriPerFin-${VERSION}-arm64.dmg" ;;
            *) echo "::error::Unknown matrix label ${LABEL}"; exit 1 ;;
          esac
          target="apps/desktop/release/${name}"
          if [ ! -f "${target}" ]; then
            echo "::error::electron-builder did not produce ${target}"
            ls -la apps/desktop/release || true
            exit 1
          fi
          echo "path=${target}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      # `gh release upload` only POSTs an asset. An action that PATCHes the
      # release object would race the other matrix leg and lose an update.
      - name: Attach Installer to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
          ASSET: ${{ steps.artifact.outputs.path }}
        run: gh release upload "${TAG}" "${ASSET}" --clobber

  verify-release-assets:
    name: Verify Release Assets
    needs: [release, desktop]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A desktop build failure must not block the Home Assistant release, but
      # it must not be silent either: fail this job and annotate the release so
      # anyone on the Releases page sees why an installer is missing.
      - name: Assert installers are attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          expected=(
            "PriPerFin-Setup-${VERSION}.exe"
            "PriPerFin-${VERSION}-arm64.dmg"
          )
          mapfile -t actual < <(gh release view "${TAG}" --json assets --jq '.assets[].name')

          missing=()
          for want in "${expected[@]}"; do
            printf '%s\n' "${actual[@]}" | grep -qxF "${want}" || missing+=("${want}")
          done

          if [ ${#missing[@]} -eq 0 ]; then
            echo "All desktop installers are attached to ${TAG}."
            exit 0
          fi

          body="$(gh release view "${TAG}" --json body --jq .body)"
          case "${body}" in
            *"Desktop installers are missing"*) ;;
            *)
              note=$'\n\n---\n\n> [!WARNING]\n> **Desktop installers are missing from this release:** '"${missing[*]}"$'\n> The Home Assistant add-on update is unaffected. Re-run the failed jobs: '"${RUN_URL}"
              gh release edit "${TAG}" --notes "${body}${note}"
              ;;
          esac

          echo "::error::Release ${TAG} is published without: ${missing[*]}"
          exit 1
